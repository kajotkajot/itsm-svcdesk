# compose-lab3.yml - what Lab 3 adds to your docker-compose.yml (HANDOUT.md; MONITORING-SPEC.md M-01, M-02).
# It is not a compose file of its own: copy the three services below into the `services:` of your
# docker-compose.yml, next to your svcdesk, and add KB_INDEX_URL to svcdesk as the comment right below says.
#
#   docker compose up -d --build svcdesk kb-index         # the two services the checker starts
#   docker compose --profile observability up -d          # plus your own Prometheus (:9090) and Grafana (:3000)
#
# Bind mounts. The checker refuses a host-path bind mount on svcdesk and kb-index, the two services it starts
# (L3-CORE-1.02), exactly as in Labs 1 and 2. It never starts your prometheus and grafana, so since Lab 3 those two
# may bind-mount their configuration, as below: edit a file, restart the service, and the change is live. If you
# prefer images, each service has the two-line Dockerfile that replaces its bind mounts in a comment.
#
# svcdesk: keep everything your service already has (build: ., ports, SVCDESK_TEST_CLOCK, the named volume) and add
#
#   svcdesk:
#     environment:
#       KB_INDEX_URL: http://kb-index:8080    # M-02; your code falls back to this value when the variable is unset
#     depends_on:
#       - kb-index                            # optional: `docker compose up svcdesk` then starts kb-index too

services:
  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: ""                    # TODO: your own GitHub login, the one your receipts carry (M-01);
                                                # left empty, the container stops at once and says so
    ports:
      - "8081:8080"                             # optional: /stats and /admin/degrade from your laptop
    # No healthcheck: the image has no shell and no curl, so a check that runs a command inside it never passes
    # and `docker compose up --wait` fails (L3-CORE-1.04). Without one, --wait waits for it to be running.

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro         # prometheus.yml and alerts.yml; `docker compose restart prometheus`
    # Without the bind mount: `build: ./prometheus` instead of `image:` and `volumes:`, and prometheus/Dockerfile:
    #   FROM prom/prometheus:v3.15.0
    #   COPY prometheus.yml alerts.yml /etc/prometheus/

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # dashboards readable without a login;
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer        # log in as admin (password admin at first) to edit
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    # Without the bind mounts: `build: ./grafana` instead of `image:` and `volumes:`, and grafana/Dockerfile:
    #   FROM grafana/grafana:13.2.3
    #   COPY provisioning /etc/grafana/provisioning
    #   COPY dashboards /var/lib/grafana/dashboards

  # Stretch 2 only (L3-STRETCH-2, M-30): Toxiproxy next to svcdesk. Uncomment, then
  #   docker compose --profile gap up -d toxiproxy
  # and create the proxy and its toxic through the API on 8474 (HANDOUT.md, Stretch 2); the proxy listens on 8666.
  # toxiproxy:
  #   image: ghcr.io/shopify/toxiproxy:2.12.0     # the tag has no "v"
  #   profiles: ["gap"]
  #   ports:
  #     - "8474:8474"                             # the API
  #     - "8666:8666"                             # the proxy in front of svcdesk
