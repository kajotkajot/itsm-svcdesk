services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: /data/svcdesk.db
    volumes:
      - svcdesk-data:/data

  tests:
    profiles: ["tests"]
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      PYTHONPATH: /app/src
      SVCDESK_URL: http://svcdesk:8080
    depends_on:
      - svcdesk

volumes:
  svcdesk-data:
