# itsmlab.yaml - read by the checker (itsmlab) and by the wrappers itsmlab.sh / itsmlab.ps1.
lab: 4 # the lab this repository is currently submitting
baselines:
  lab3: student # this repository carries the student's Lab 3 implementation
repository: "kajotkajot/itsm-svcdesk" # your public GitHub repository, e.g. "jkowalski/itsm-svcdesk"
submissions_repo: swasik/itsm-2026-submissions
checker_image:
  ghcr.io/swasik/itsmlab:2026 # the course tag: leave it; a checker update is `docker pull` of this tag
  # (the grader alone pins a digest and records it in every grade)
